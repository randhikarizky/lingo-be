services:
  postgres:
    image: postgres:16-alpine
    container_name: lingora-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lingora
      POSTGRES_PASSWORD: lingora_secret
      POSTGRES_DB: lingora_dev
    volumes:
      - lingora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingora -d lingora_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lingora_postgres_data:
